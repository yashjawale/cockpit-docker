# Run the integration test suite on pull requests and pushes to main.
# This replaces the former .cirrus.yml: Cirrus CI shut down in June 2026.
name: tests
on:
  push:
    branches:
      - main
  pull_request:
  # allow manual runs from https://github.com/yashjawale/cockpit-docker/actions
  workflow_dispatch:
# cancel superseded runs on the same branch/pull request
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    container:
      # official cockpit CI container, with cockpit related build and test dependencies
      image: ghcr.io/cockpit-project/tasks
      # privileged so that libvirt can run VMs with KVM inside the container
      options: --user root --privileged --device /dev/kvm
    strategy:
      fail-fast: false
      matrix:
        TEST_OS: [fedora-44, debian-trixie]
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # https://github.blog/2022-04-12-git-security-vulnerability-announced/
      - name: Pacify git's permission check
        run: git config --global --add safe.directory /__w/cockpit-docker/cockpit-docker

      - name: Fix KVM permissions
        run: chmod 666 /dev/kvm 2>/dev/null || true

      # the test VMs are managed via libvirt (bots connect to qemu:///session);
      # the container has no systemd, so configure libvirt for running inside a
      # container and start the daemons manually. As root they listen on
      # /run/libvirt/*-sock. The security driver must be disabled, as overlayfs
      # does not support the trusted.* xattrs it wants to set, and cgroup
      # management cannot work without systemd. QEMU also needs virtlogd.
      - name: Start libvirt daemons
        run: |
          printf 'security_driver = "none"\ncgroup_controllers = [ ]\n' > /etc/libvirt/qemu.conf
          virtqemud -d
          virtlogd -d
          for i in $(seq 30); do
            [ -e /run/libvirt/virtqemud-sock ] && [ -e /run/libvirt/virtlogd-sock ] && break
            sleep 1
          done
          virsh -c qemu:///session list 2>&1 || true

      # test PO template generation
      - name: Generate PO templates
        run: make po/cockpit-docker.pot

      # chromium has too little /dev/shm, and we can't make that bigger
      - name: Run integration tests
        run: TEST_BROWSER=firefox TEST_JOBS=$(nproc) TEST_OS=$TEST_OS make check
