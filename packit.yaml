# Enable RPM builds and running integration tests in PRs through https://packit.dev/
# To use this, enable Packit-as-a-service in GitHub: https://packit.dev/docs/packit-as-a-service/
# See https://packit.dev/docs/configuration/ for the format of this file

specfile_path: cockpit-docker.spec
# use the nicely formatted release description from our upstream release, instead of git shortlog
copy_upstream_release_description: true

srpm_build_deps:
  - jq
  - make
  - nodejs-npm

actions:
  post-upstream-clone:
    - make cockpit-docker.spec
    # replace Source1 manually, as create-archive: can't handle multiple tarballs
    - make node-cache
    - sh -c 'sed -i "/^Source1:/ s/https:.*/$(ls *-node*.tar.xz)/" cockpit-*.spec'
  create-archive: make dist
  # cockpit-docker.git has no release tags; your project can drop this once you have a release
  get-current-version: make print-version

jobs:
  - job: tests
    trigger: pull_request
    targets: &test_targets
      - fedora-all
      - fedora-latest-stable-aarch64
      - centos-stream-9
      - centos-stream-9-aarch64
      - centos-stream-10

  # run the same tests when a PR gets merged to main
  - job: tests
    trigger: commit
    branch: "^main$"
    targets: *test_targets

  - job: copr_build
    trigger: pull_request
    targets: *test_targets

  # Build releases in COPR: https://packit.dev/docs/configuration/#copr_build
  # The COPR owner and project must exist; adjust them to your namespace.
  - job: copr_build
    trigger: release
    owner: yashjawale
    project: cockpit-docker
    preserve_project: True
    targets:
      - fedora-all
      - centos-stream-9-x86_64

  # Build releases in Fedora: https://packit.dev/docs/configuration/#propose_downstream
  # These require Fedora packager rights and are left disabled for now.
  #- job: propose_downstream
